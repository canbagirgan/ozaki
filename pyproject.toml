[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ozaki-cerebras-roofline"
version = "0.1.0"
description = "Reproducible CS-3 host-transfer and GEMM roofline benchmarks"
requires-python = ">=3.11"
dependencies = ["numpy==1.25.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["benchmarks/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
